<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Music Player</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    body {
      margin: 0;
      padding: 0 15px; /* padding for small screens */
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 400px;
      width: 100%;
      padding: 40px 30px;
      background-color: rgba(30, 30, 47, 0.9);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      color: #00ffe1;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #00ffe1;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    button:hover,
    button:focus {
      background: #00bfa5;
      outline: none;
    }

    .back-link {
      margin-top: 15px;
      display: inline-block;
      color: #00ffe1;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .back-link:hover,
    .back-link:focus {
      color: #00bfa5;
      outline: none;
      text-decoration: underline;
    }

    .alert {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
      color: white;
      box-sizing: border-box;
    }

    .alert.error {
      background-color: #f44336; /* Red */
    }

    .alert.success {
      background-color: #4caf50; /* Green */
    }

    .alert.info {
      background-color: #2196f3; /* Blue */
    }

    .alert.warning {
      background-color: #ff9800; /* Orange */
    }
  </style>
</head>
<body>

  <main class="container" role="main" aria-label="Login form">
    <h1>Login</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="alert {{ message.tags }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form action="{% url 'login' %}" method="POST" novalidate>
      {% csrf_token %}
      <input
        type="text"
        placeholder="Username"
        name="username"
        required
        autocomplete="username"
        aria-label="Username"
      />
      <input
        type="password"
        placeholder="Password"
        name="password"
        required
        autocomplete="current-password"
        aria-label="Password"
      />
      <button type="submit">Login</button>
    </form>

    <a class="back-link" href="{% url 'home' %}">← Back to Home</a><br />
    <a class="back-link" href="{% url 'register' %}">← Back to Register</a>
  </main>

</body>
</html>
