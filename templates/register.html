<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - Music Player</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 400px;
      width: 100%;
      padding: 40px 30px;
      background-color: rgba(30, 30, 47, 0.9);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      color: #00ffe1;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #00ffe1;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      background: #00bfa5;
    }

    .back-link {
      margin-top: 15px;
      display: block;
      color: #00ffe1;
      text-decoration: none;
      word-wrap: break-word;
    }

    .alert {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
      color: white;
    }

    .alert.error {
      background-color: #f44336;
    }

    .alert.success {
      background-color: #4caf50;
    }

    .alert.info {
      background-color: #2196f3;
    }

    .alert.warning {
      background-color: #ff9800;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      body {
        height: auto;
        padding: 20px;
      }

      .container {
        padding: 30px 20px;
        border-radius: 15px;
      }

      h1 {
        font-size: 28px;
      }

      input,
      button {
        font-size: 14px;
        padding: 10px;
      }

      .back-link {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Register</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="alert {{ message.tags }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form action="{% url 'register' %}" method="POST">
      {% csrf_token %}
      <input type="text" placeholder="Full Name" name="full_name" required />
      <input type="text" placeholder="Username" name="username" required />
      <input type="email" placeholder="Email" name="email" required />
      <input type="password" placeholder="Password" name="password" required />
      <button type="submit">Register</button>
    </form>

    <a class="back-link" href="{% url 'login' %}">← Back to Login</a>
  </div>
</body>
</html>
