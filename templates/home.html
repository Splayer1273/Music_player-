<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Music Player</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 40px 30px;
      background-color: rgba(30, 30, 47, 0.9);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 20px;
      color: #00ffe1;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #00ffe1;
    }

    p {
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #dcdcdc;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .buttons a {
      display: inline-block;
      padding: 12px 25px;
      background: #00ffe1;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      border-radius: 5px;
      transition: background 0.3s ease;
      min-width: 140px;
      text-align: center;
    }

    .buttons a:hover,
    .buttons a:focus {
      background: #00bfa5;
      outline: none;
    }

    @media (max-width: 500px) {
      .buttons a {
        width: 100%;
        min-width: unset;
      }
    }
  </style>
</head>
<body>

  <div class="container" role="main" aria-label="Welcome Section">
    <div class="logo" aria-hidden="true"><i class="fas fa-music"></i></div>
    <h1>Welcome to Music Player</h1>
    <p>Your personalized audio experience. Stream your favorite songs, read lyrics, and discover more every day.</p>

    <nav class="buttons" aria-label="Primary navigation">
      <a href="{% url 'register' %}">Register</a>
      <a href="{% url 'login' %}">Login</a>
      <a href="/dashboard/">Start Listening</a>
    </nav>
  </div>

</body>
</html>
